name: Build The Hammer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows VST3 + Standalone
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads JUCE 8)
        run: cmake -B build -A x64 -DHAMMER_BUILD_TOOLS=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Self-test the engine
        run: build\HammerRender_artefacts\Release\HammerRender.exe --selftest

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/TheHammer_artefacts/Release/VST3/The Hammer.vst3" dist/
          Copy-Item -Recurse "build/TheHammerFX_artefacts/Release/VST3/The Hammer FX.vst3" dist/
          Copy-Item -Recurse "build/TheHammerEars_artefacts/Release/VST3/The Hammer Ears.vst3" dist/
          Copy-Item "build/TheHammer_artefacts/Release/Standalone/The Hammer.exe" dist/
          Copy-Item docs/INSTALL.txt dist/
          Copy-Item CREDITS.md dist/
          Compress-Archive -Path dist/* -DestinationPath TheHammer-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TheHammer-Windows
          path: dist

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TheHammer-Windows.zip

  linux-test:
    name: Linux build + demo renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Build tool
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target HammerRender
      - name: Self-test
        run: build/HammerRender_artefacts/Release/HammerRender --selftest
      - name: Render demos
        run: build/HammerRender_artefacts/Release/HammerRender --render demos
      - uses: actions/upload-artifact@v4
        with:
          name: TheHammer-demo-renders
          path: demos

  # ---------------------------------------------------------------------------
  # Version control: every NEW version number publishes a GitHub Release with
  # the build attached.  Bump VERSION in CMakeLists.txt, push to main, and
  # Release vX.Y.Z appears (notes come from CHANGELOG.md).  The APT Industrial
  # updater on your PC installs the newest Release for FL Studio automatically.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Quality gate: nothing is published until the plugin passes pluginval (the
  # standard plugin test tool, including Steinberg's VST3 validator). It loads
  # the plugin like a DAW, plays audio at many sample rates and block sizes,
  # moves every parameter and saves/restores state.  Fail = no Release, and
  # the updater keeps everyone on the last good version.
  # ---------------------------------------------------------------------------
  test:
    name: Test the plugin before release (pluginval)
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Get the Windows build
        uses: actions/download-artifact@v4
        with:
          pattern: '*-Windows'
          path: dist

      - name: Get pluginval 1.0.4
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Test every plugin in the build
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem dist -Recurse -Directory -Filter *.vst3 | Where-Object { $_.Parent.Name -notlike '*.vst3' })
          if ($bundles.Count -eq 0) { throw 'The build contains no .vst3 plugin' }
          New-Item -ItemType Directory -Force -Path pluginval-logs | Out-Null
          $failed = 0
          foreach ($b in $bundles) {
            Write-Host "=== Testing $($b.Name)"
            # pluginval is a windowed program: start it and WAIT for its real exit code
            $args = "--strictness-level 5 --skip-gui-tests --timeout-ms 300000 --output-dir pluginval-logs --validate `"$($b.FullName)`""
            $p = Start-Process -FilePath .\pluginval\pluginval.exe -ArgumentList $args -NoNewWindow -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Host "::error::$($b.Name) FAILED pluginval (exit $($p.ExitCode))"; $failed++ } else { Write-Host "$($b.Name) PASSED pluginval" }
          }
          if ($failed -gt 0) { exit 1 }

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-report
          path: pluginval-logs
          retention-days: 30

  release:
    name: Publish this version as a GitHub Release
    needs: [windows, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Is this a new version?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(grep -m1 -oE 'project\([A-Za-z0-9_]+ +VERSION +[0-9]+(\.[0-9]+)+' CMakeLists.txt)
          name=$(echo "$line" | sed -E 's/project\(([A-Za-z0-9_]+).*/\1/')
          ver=$(echo "$line" | grep -oE '[0-9]+(\.[0-9]+)+$')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$ver is already released - nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Publishing v$ver."
          fi

      - name: Get the Windows build
        if: steps.v.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: '*-Windows'
          path: dist

      - name: Publish the Release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
          NAME: ${{ steps.v.outputs.name }}
        run: |
          mkdir -p upload
          for d in dist/*/; do n=$(basename "$d"); (cd "$d" && zip -qr "$GITHUB_WORKSPACE/upload/${n}-v${VER}.zip" .); done
          ls -la upload
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VER" '/^## /{ if (p) exit; if (index($0, v)) { p = 1; next } } p' CHANGELOG.md > notes.md
          fi
          [ -s notes.md ] || git log -1 --format=%B "$GITHUB_SHA" > notes.md
          gh release create "v$VER" upload/*.zip -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$NAME v$VER" --notes-file notes.md
